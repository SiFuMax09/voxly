[package]
name = "voxly"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# GPU backends for Windows/Linux; Apple Silicon uses Metal automatically.
# See crates/core/Cargo.toml for the build requirements of each.
vulkan = ["voxly-core/vulkan"]
cuda = ["voxly-core/cuda"]
hip = ["voxly-core/hip"]

[lib]
name = "voxly_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
voxly-core = { path = "../crates/core" }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-clipboard-manager = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
enigo = "0.5"

# Local transcription is desktop-only for now (whisper.cpp cross-compiles to
# mobile, but that is not set up yet).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies.voxly-core]
path = "../crates/core"
features = ["local"]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13.2"
gtk = "0.18"
gtk-layer-shell = "0.8"
wl-clipboard-rs = "0.9"
