<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Voxly overlay</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font: 600 14px system-ui, sans-serif; user-select: none; }
    body { display: flex; align-items: center; justify-content: center; }
    #pill {
      display: flex; align-items: center; gap: 10px; padding: 9px 16px; border-radius: 999px;
      background: rgba(18, 20, 26, .92); color: #fff; box-shadow: 0 4px 18px rgba(0, 0, 0, .35);
      opacity: 0; transform: translateY(-6px) scale(.96); transition: opacity .15s, transform .15s;
    }
    #pill.on { opacity: 1; transform: none; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #ff4d4d; animation: pulse 1.1s infinite; }
    .bars { display: flex; gap: 3px; align-items: center; height: 18px; }
    .bars i { width: 3px; border-radius: 2px; background: #3b5bff; animation: bar 0.9s ease-in-out infinite; }
    .bars i:nth-child(2) { animation-delay: .15s; } .bars i:nth-child(3) { animation-delay: .3s; } .bars i:nth-child(4) { animation-delay: .45s; }
    .spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(255,255,255,.25); border-top-color: #fff; animation: spin .8s linear infinite; }
    #pill:not(.rec) .dot, #pill:not(.rec) .bars, #pill.rec .spin { display: none; }
    @keyframes pulse { 50% { opacity: .35; } }
    @keyframes bar { 0%, 100% { height: 5px; } 50% { height: 18px; } }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="pill"><span class="dot"></span><span class="spin"></span><span id="text">Recording</span><span class="bars"><i></i><i></i><i></i><i></i></span></div>
  <script>
    const pill = document.getElementById('pill');
    const text = document.getElementById('text');
    window.__TAURI__.event.listen('status', (e) => {
      const s = e.payload;
      pill.classList.toggle('on', s !== 'idle');
      pill.classList.toggle('rec', s === 'recording');
      if (s === 'recording') text.textContent = 'Recording';
      if (s === 'transcribing') text.textContent = 'Transcribing…';
    });
  </script>
</body>
</html>
